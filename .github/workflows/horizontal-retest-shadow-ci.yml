name: Horizontal Retest Shadow Checks
on:
  pull_request:
    paths:
      - "app/lib/research/horizontalRetest.ts"
      - "app/lib/research/horizontalRetestComparison.ts"
      - "app/lib/research/horizontalRetestArchiveStats.ts"
      - "app/lib/research/horizontalAutoPolicy.ts"
      - "app/lib/research/horizontalAutoRunner.ts"
      - "app/lib/research/horizontalAutoSwitch.ts"
      - "app/api/cron/horizontal-retest-research/**"
      - "vercel.json"
      - "supabase/migrations/20261012_create_horizontal_retest_auto_control_daily.sql"
      - "supabase/migrations/20261012_create_horizontal_retest_archive.sql"
      - "app/admin/horizontal-retest/**"
      - "app/admin/learning-hub/page.tsx"
      - "tests/horizontalRetest.test.mjs"
      - "tests/horizontalRetestComparison.test.mjs"
      - "tests/horizontalRetestArchive.test.mjs"
      - "tests/horizontalAutoDaily.test.mjs"
      - "app/lib/research/msbMaSwing.ts"
      - "app/lib/research/msbMaVolumeSensitivity.ts"
      - "app/admin/shadow-msb-ob-swing/**"
      - "tests/msbMaSwing.test.mjs"
      - "tests/msbMaVolumeSensitivity.test.mjs"
      - "app/lib/research/msbResearchPresets.ts"
      - "app/lib/research/msbMaArchiveStats.ts"
      - "supabase/migrations/20261012_create_msb_volume_research_archive.sql"
      - "tests/msbMaArchive.test.mjs"
      - ".github/workflows/horizontal-retest-shadow-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/horizontalRetest.test.mjs tests/horizontalRetestComparison.test.mjs tests/horizontalRetestArchive.test.mjs tests/horizontalAutoDaily.test.mjs tests/msbMaSwing.test.mjs tests/msbMaVolumeSensitivity.test.mjs tests/msbMaArchive.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
