name: Repeat Candidate Risk Research CI
on:
  pull_request:
    paths:
      - "app/api/admin/repeat-candidate-risk/**"
      - "app/admin/repeat-candidate-risk/**"
      - "tests/repeatCandidateRisk.test.mjs"
      - ".github/workflows/repeat-candidate-risk-ci.yml"
  push:
    branches:
      - "research/repeat-candidate-risk-readonly-20261028"
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only and admin guard tests
        run: node --test tests/repeatCandidateRisk.test.mjs
