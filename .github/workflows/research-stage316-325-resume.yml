name: Research Stage316-325 Resume Guard
on:
  pull_request:
    paths:
      - 'app/lib/learning/swingAuditResumeGuard.ts'
      - 'tests/stage316-325-resume-guard.test.cjs'
      - '.github/workflows/research-stage316-325-resume.yml'
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stage316-325-resume-guard.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
