name: Dual Surge Research Safety Audit
on:
  push:
    branches:
      - fix/dual-surge-dev-db-isolation-20261023
    paths:
      - 'tests/research/dualSurge*'
      - 'app/admin/dual-surge-shadow/**'
      - 'app/learning/patterns/**'
      - 'scripts/dual-surge-offline-replay.mjs'
      - 'app/lib/learningOwner*'
      - 'app/lib/research/dualSurge*'
      - 'docs/research/dual-surge-user-diagnostic-events-20261025.json'
      - '.github/workflows/dual-surge-safety-audit.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/research/dualSurge*'
      - 'app/admin/dual-surge-shadow/**'
      - 'app/learning/patterns/**'
      - 'scripts/dual-surge-offline-replay.mjs'
      - 'app/lib/learningOwner*'
      - 'app/lib/research/dualSurge*'
      - 'docs/research/dual-surge-user-diagnostic-events-20261025.json'
      - '.github/workflows/dual-surge-safety-audit.yml'
permissions:
  contents: read
jobs:
  offline-audit:
    if: github.ref == 'refs/heads/fix/dual-surge-dev-db-isolation-20261023' || github.event.pull_request.head.ref == 'fix/dual-surge-dev-db-isolation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript compile check
        if: steps.install.outcome == 'success'
        id: types
        run: npx tsc --noEmit --pretty false
      - name: Offline research safety tests
        if: always() && steps.install.outcome == 'success' && !cancelled()
        id: audit
        run: node --test tests/research/dualSurge*.test.mjs
      - name: Record audit evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Dual Surge research safety audit'
            echo ''
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Dependency install: ${{ steps.install.outcome }}"
            echo "- TypeScript check: ${{ steps.types.outcome }}"
            echo "- Offline test step: ${{ steps.audit.outcome }}"
            echo '- Production approval: NO'
            echo '- J-Quants provider permission: UNVERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"
