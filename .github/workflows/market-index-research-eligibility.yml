name: Market index research eligibility tests

on:
  push:
    branches:
      - research/market-index-shadow-20261021
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-index-eligibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated TypeScript eligibility tests
        run: npm run test:market-index-research
