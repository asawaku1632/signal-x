name: Dual Surge Research Tests
on:
  push:
    branches:
      - fix/dual-surge-dev-db-isolation-20261023
    paths:
      - 'app/lib/research/**'
      - 'tests/research/**'
      - '.github/workflows/dual-surge-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run all isolated research tests
        run: node --test tests/research/dualSurgeDetectors.test.mjs tests/research/dualSurgeEvaluation.test.mjs tests/research/dualSurgeLedger.test.mjs tests/research/dualSurgeComparison.test.mjs tests/research/dualSurgeQualityGates.test.mjs tests/research/dualSurgePreflight.test.mjs
