name: SIGNALX Night Market Report

on:
  schedule:
    # GitHub Actions cron is UTC.
    # Retry around 19:00 JST because scheduled workflows can start late.
    # The API guarantees only one report is sent per trading day.
    - cron: "0,5,10,15,20,25 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: signalx-night-market-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send 19:00 night market report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://signal-x-ppjg.vercel.app/api/cron/night-market-report"
