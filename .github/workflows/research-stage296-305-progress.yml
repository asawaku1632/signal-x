name: Research Stage296-305 Audit Progress
on:
  pull_request:
    paths:
      - 'app/lib/learning/swingAuditProgress.ts'
      - 'tests/stage296-305-progress.test.cjs'
      - '.github/workflows/research-stage296-305-progress.yml'
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stage296-305-progress.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
