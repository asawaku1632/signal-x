name: Safe chart freshness patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-freshness-safe
      - name: Patch exact chart GET tail
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/chart/[symbol]/route.ts')
          s=p.read_text()
          s=s.replace('import { after } from "next/server";\n','')
          start=s.index('  if (snapshot) {', s.index('export async function GET'))
          old=s[start:]
          expected='''  if (snapshot) {
    if (ageMs >= CHART_FRESH_MS) {
      after(async () => {
        await update().catch((error) => console.error("chart snapshot refresh failed:", error));
      });
    }
    return NextResponse.json({
      ...snapshot.payload,
      status: ageMs < CHART_FRESH_MS ? "fresh" : "stale",
      updatedAt: snapshot.updatedAt,
    });
  }

  const { response, payload } = await update();
  return NextResponse.json({ ...payload, status: "fresh", updatedAt: new Date().toISOString() }, {
    status: response.status,
  });
}'''
          if old != expected:
            raise SystemExit('GET tail differs from reviewed source; no edit made')
          new='''  if (snapshot && ageMs < CHART_FRESH_MS) {
    return NextResponse.json({
      ...snapshot.payload,
      status: "fresh",
      updatedAt: snapshot.updatedAt,
    });
  }

  // A stale intraday chart is misleading after a real-time alert.
  // Wait for the newest available chart response instead of returning stale data first.
  const { response, payload } = await update();
  return NextResponse.json(
    { ...payload, status: "fresh", updatedAt: new Date().toISOString() },
    { status: response.status },
  );
}'''
          p.write_text(s[:start]+new)
          PY
          git diff --check
          git diff -- 'app/api/chart/[symbol]/route.ts'
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'app/api/chart/[symbol]/route.ts'
          git commit -m 'fix: refresh stale chart before responding'
          git push origin fix/chart-freshness-safe
