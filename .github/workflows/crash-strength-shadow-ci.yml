name: Crash Strength Shadow CI

on:
  push:
    branches:
      - "research/crash-strength-shadow-*"
      - "research/crash-strength-market-reference-*"
      - "research/crash-nextday-evidence-*"
      - "research/crash-true-session-audit-*"
      - "research/crash-benchmark-oos-*"
      - "feature/crash-strength-tabs-dashboard-*"
      - "fix/crash-dashboard-match-concept-*"
    paths:
      - "app/lib/research/crashStrengthShadow.mjs"
      - "app/lib/research/crashStrengthMarketReference.mjs"
      - "app/lib/research/crashStrengthMarketReferenceRunner.ts"
      - "tests/crashStrengthMarketReference.test.mjs"
      - "app/admin/crash-strength/page.tsx"
      - "app/admin/crash-strength/CrashStrengthDashboardTabs.tsx"
      - "tests/crashStrengthDashboardTabs.test.mjs"
      - "app/admin/crash-strength/CrashBenchmarkCards.tsx"
      - "tests/crashStrengthConceptLayout.test.mjs"
      - "tests/crashStrengthShadow.test.mjs"
      - "tests/crashNextDayEvidence.test.mjs"
      - "tests/crashTrueSessionAudit.test.mjs"
      - "tests/crashNikkeiOutperformance.test.mjs"
      - ".github/workflows/crash-strength-shadow-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/lib/research/crashStrengthShadow.mjs"
      - "app/lib/research/crashStrengthMarketReference.mjs"
      - "app/lib/research/crashStrengthMarketReferenceRunner.ts"
      - "app/admin/crash-strength/page.tsx"
      - "app/admin/crash-strength/CrashStrengthDashboardTabs.tsx"
      - "tests/crashStrengthDashboardTabs.test.mjs"
      - "app/admin/crash-strength/CrashBenchmarkCards.tsx"
      - "tests/crashStrengthConceptLayout.test.mjs"
      - "tests/crashStrengthShadow.test.mjs"
      - "tests/crashNextDayEvidence.test.mjs"
      - "tests/crashTrueSessionAudit.test.mjs"
      - "tests/crashNikkeiOutperformance.test.mjs"
      - "tests/crashStrengthMarketReference.test.mjs"
      - ".github/workflows/crash-strength-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run isolated crash strength tests
        run: node --test tests/crashStrengthShadow.test.mjs tests/crashStrengthMarketReference.test.mjs tests/crashNextDayEvidence.test.mjs tests/crashTrueSessionAudit.test.mjs tests/crashNikkeiOutperformance.test.mjs tests/crashStrengthDashboardTabs.test.mjs tests/crashStrengthConceptLayout.test.mjs
