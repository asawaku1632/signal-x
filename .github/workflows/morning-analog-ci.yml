name: Morning Analog Offline Research CI
on:
  pull_request:
    paths:
      - "app/lib/research/morningAnalog.mjs"
      - "app/lib/research/morningHistoricalAdapter.mjs"
      - "app/lib/research/savedDailyBaseline.mjs"
      - "app/lib/research/priorScoreRobustness.mjs"
      - "app/lib/research/evidenceClassifier.mjs"
      - "app/lib/research/dailyExportTemplate.mjs"
      - "app/lib/research/dailyExportNormalizer.mjs"
      - "app/lib/research/exportEvidenceCoverage.mjs"
      - "app/lib/research/dailyEvidenceCounts.mjs"
      - "app/lib/research/researchUseTiers.mjs"
      - "app/lib/research/savedPriceExploration.mjs"
      - "app/lib/research/savedScoreDrift.mjs"
      - "app/lib/research/monthlyPriorScoreComparison.mjs"
      - "app/lib/research/chronologicalScoreAudit.mjs"
      - "app/lib/research/prospectiveScoreLedger.mjs"
      - "app/lib/research/savedOutcomeRelationAudit.mjs"
      - "scripts/report-morning-bottom.mjs"
      - "scripts/report-prior-score-robustness.mjs"
      - "scripts/report-saved-price-exploration.mjs"
      - "scripts/report-prospective-score-ledger.mjs"
      - "tests/morning-analog.test.mjs"
      - "tests/morning-historical-adapter.test.mjs"
      - "tests/saved-daily-baseline.test.mjs"
      - "tests/prior-score-robustness.test.mjs"
      - "tests/prior-score-report.test.mjs"
      - "tests/evidence-classifier.test.mjs"
      - "tests/daily-export-template.test.mjs"
      - "tests/daily-export-normalizer.test.mjs"
      - "tests/export-evidence-coverage.test.mjs"
      - "tests/daily-evidence-counts.test.mjs"
      - "tests/research-use-tiers.test.mjs"
      - "tests/saved-price-exploration.test.mjs"
      - "tests/saved-price-report.test.mjs"
      - "tests/saved-score-drift.test.mjs"
      - "tests/monthly-prior-score-comparison.test.mjs"
      - "tests/chronological-score-audit.test.mjs"
      - "tests/prospective-score-ledger.test.mjs"
      - "tests/prospective-score-report.test.mjs"
      - "tests/saved-outcome-relation-audit.test.mjs"
      - ".github/workflows/morning-analog-ci.yml"
  push:
    branches:
      - "research/morning-analog-bottom-v1-20261028"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/morning-analog.test.mjs tests/morning-historical-adapter.test.mjs tests/saved-daily-baseline.test.mjs tests/prior-score-robustness.test.mjs tests/prior-score-report.test.mjs tests/evidence-classifier.test.mjs tests/daily-export-template.test.mjs tests/daily-export-normalizer.test.mjs tests/export-evidence-coverage.test.mjs tests/daily-evidence-counts.test.mjs tests/research-use-tiers.test.mjs tests/saved-price-exploration.test.mjs tests/saved-price-report.test.mjs tests/saved-score-drift.test.mjs tests/monthly-prior-score-comparison.test.mjs tests/chronological-score-audit.test.mjs tests/prospective-score-ledger.test.mjs tests/prospective-score-report.test.mjs tests/saved-outcome-relation-audit.test.mjs
