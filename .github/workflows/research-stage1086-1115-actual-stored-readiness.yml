name: Research Stage1086-1115 Actual Stored Readiness
on:
  pull_request:
    paths:
      - 'app/lib/learning/researchActualStoredReadiness.mjs'
      - 'tests/stage1086-1115-actual-stored-readiness.test.mjs'
      - '.github/workflows/research-stage1086-1115-actual-stored-readiness.yml'
permissions:
  contents: read
jobs:
  read-only-schema-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/stage1086-1115-actual-stored-readiness.test.mjs
