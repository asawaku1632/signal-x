name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/signalx-hardening-20260927

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit details
        continue-on-error: true
        run: npm audit

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        run: npm run build

      - name: Enforce lint after build
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Lint failed. See the Lint step for details."
            exit 1
          fi
