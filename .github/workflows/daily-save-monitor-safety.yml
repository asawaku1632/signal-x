name: Daily Save Monitor Safety
on:
  pull_request:
    paths:
      - "app/lib/learning/learningSaveMonitor.ts"
      - "app/lib/learning/learningSaveStatus.ts"
      - "tests/learningSaveMonitor.test.mjs"
      - ".github/workflows/daily-save-monitor-safety.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run daily save monitor regression tests
        run: node --test tests/learningSaveMonitor.test.mjs
      - name: Type-check app
        run: |
          npx next typegen
          npx tsc --noEmit
