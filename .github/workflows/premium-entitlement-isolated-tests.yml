name: Premium Entitlement Isolated Checks

on:
  pull_request:
    paths:
      - 'app/lib/billing/premiumEntitlementCore.ts'
      - 'scripts/migrations/20261018_create_premium_entitlements_isolated.sql'
      - 'tests/premiumEntitlementCore.test.mjs'
      - 'app/lib/billing/verifiedBillingEventCore.ts'
      - 'tests/verifiedBillingEventCore.test.mjs'
      - 'app/lib/billing/billingIngestionContract.ts'
      - 'scripts/migrations/20261018_create_billing_event_inbox_isolated.sql'
      - 'tests/billingIngestionContract.test.mjs'
      - 'app/lib/billing/verificationBoundary.ts'
      - 'tests/verificationBoundary.test.mjs'
      - 'app/lib/billing/subscriptionOwnershipCore.ts'
      - 'tests/subscriptionOwnershipCore.test.mjs'
      - 'app/lib/billing/persistVerifiedBillingUpdate.ts'
      - 'tests/persistVerifiedBillingUpdate.test.mjs'
      - 'tests/premiumPostgresIntegration.test.mjs'
      - 'app/lib/billing/playSubscriptionState.ts'
      - 'tests/playSubscriptionState.test.mjs'
      - 'app/lib/billing/playSubscriptionLookup.ts'
      - 'tests/playSubscriptionLookup.test.mjs'
      - 'app/lib/billing/playPurchaseRestoration.ts'
      - 'tests/playPurchaseRestoration.test.mjs'
      - 'scripts/migrations/20261018_create_play_purchase_bindings_isolated.sql'
      - 'app/lib/billing/playTokenFingerprint.ts'
      - 'tests/playPurchaseBinding.test.mjs'
      - 'app/lib/billing/playRestorationPreflight.ts'
      - 'tests/playRestorationPreflight.test.mjs'
      - 'app/lib/billing/playInitialPurchaseApproval.ts'
      - 'tests/playInitialPurchaseApproval.test.mjs'
      - 'app/lib/billing/registerFirstPlayPurchase.ts'
      - 'app/lib/billing/refreshRestoredPlayEntitlement.ts'
      - 'android-twa/**'
      - 'app/manifest.ts'
      - 'scripts/audit-android-play-billing.mjs'
      - 'tests/androidBillingReadiness.test.mjs'
      - 'docs/research/android-play-billing-readiness-20261018.md'
      - '.github/workflows/premium-entitlement-isolated-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated premium policy tests
        run: node --experimental-strip-types --test tests/premiumEntitlementCore.test.mjs tests/verifiedBillingEventCore.test.mjs tests/billingIngestionContract.test.mjs tests/verificationBoundary.test.mjs tests/subscriptionOwnershipCore.test.mjs tests/persistVerifiedBillingUpdate.test.mjs tests/playSubscriptionState.test.mjs tests/playSubscriptionLookup.test.mjs tests/playPurchaseRestoration.test.mjs tests/playPurchaseBinding.test.mjs tests/playRestorationPreflight.test.mjs tests/playInitialPurchaseApproval.test.mjs tests/androidBillingReadiness.test.mjs
      - name: Verify TypeScript
        run: |
          npm ci --ignore-scripts
          npx next typegen
          npx tsc --noEmit

  premium-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: premium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d premium_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify atomic billing persistence against disposable PostgreSQL
        env:
          BILLING_TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@localhost:5432/premium_ci
        run: node --experimental-strip-types --test tests/premiumPostgresIntegration.test.mjs
