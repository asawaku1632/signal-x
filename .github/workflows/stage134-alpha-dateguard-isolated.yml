name: Stage 134 Combined Alpha Date Guard (isolated)
on:
  push:
    branches:
      - test/stage134-alpha-dateguard-isolated
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-realdb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_only
          POSTGRES_PASSWORD: ephemeral_test_password
          POSTGRES_DB: signalx_alpha217_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_only -d signalx_alpha217_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run combined isolated database integration
        env:
          SIGNALX_E2E_DATABASE_URL: postgres://test_only:ephemeral_test_password@127.0.0.1:5432/signalx_alpha217_ci
        run: node tests/stage134-alpha-dateguard-realdb.test.cjs
      - name: Run isolated date and code regression tests
        run: |
          node --test tests/swingUniverseAudit.test.mjs
          node --test tests/swingUniverseDateGuard.test.cjs
