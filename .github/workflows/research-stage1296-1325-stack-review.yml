name: Research Stage1296-1325 Stack Safety Inspection
on:
  pull_request:
    paths:
      - 'docs/research/stage1296-1325-stack-audit-20261028.md'
      - 'tests/stage1296-1325-stack-review.test.mjs'
      - '.github/workflows/research-stage1296-1325-stack-review.yml'
permissions:
  contents: read
jobs:
  research-stack-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/stage1296-1325-stack-review.test.mjs
