name: Apply stale chart freshness fix

on:
  push:
    paths:
      - .github/workflows/fix-stale-chart.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch chart freshness behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/chart/[symbol]/route.ts')
          text = path.read_text()
          text = text.replace('import { after } from "next/server";\n', '')
          old = '''  if (snapshot) {
            if (ageMs >= CHART_FRESH_MS) {
              after(async () => {
                await update().catch((error) => console.error("chart snapshot refresh failed:", error));
              });
            }
            return NextResponse.json({
              ...snapshot.payload,
              status: ageMs < CHART_FRESH_MS ? "fresh" : "stale",
              updatedAt: snapshot.updatedAt,
            });
          }

          const { response, payload } = await update();
          return NextResponse.json({ ...payload, status: "fresh", updatedAt: new Date().toISOString() }, {
            status: response.status,
          });'''
          new = '''  if (snapshot && ageMs < CHART_FRESH_MS) {
            return NextResponse.json({
              ...snapshot.payload,
              status: "fresh",
              updatedAt: snapshot.updatedAt,
            });
          }

          // Do not render an old intraday chart while a refresh happens in the
          // background. Notification taps must receive the newest available
          // Yahoo chart response before the page is painted.
          const { response, payload } = await update();
          return NextResponse.json(
            { ...payload, status: "fresh", updatedAt: new Date().toISOString() },
            { status: response.status },
          );'''
          if old not in text:
              raise SystemExit('target GET block not found; refusing unsafe edit')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/api/chart/[symbol]/route.ts'
          git diff --cached --check
          git commit -m "fix: refresh stale chart before responding"
          git push origin main
