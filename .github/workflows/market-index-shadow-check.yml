name: Market index shadow research checks
on:
  pull_request:
    paths:
      - 'app/lib/research/marketIndex*'
      - 'scripts/check-market-index-shadow.mjs'
      - '.github/workflows/market-index-shadow-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate shadow index data contract
        run: node scripts/check-market-index-shadow.mjs
