name: Research Stage846-875 Regime Evidence Join
on:
  pull_request:
    paths:
      - 'app/lib/learning/shadowRegimeEvidenceJoin.ts'
      - 'tests/stage846-875-regime-evidence-join.test.cjs'
      - '.github/workflows/research-stage846-875-evidence-join.yml'
permissions:
  contents: read
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stage846-875-regime-evidence-join.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
