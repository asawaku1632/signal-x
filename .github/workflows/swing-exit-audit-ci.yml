name: Swing Exit Audit Checks
on:
  pull_request:
    paths:
      - "app/lib/learning/swingExitAudit.ts"
      - "app/lib/learning/swingConflictAudit.ts"
      - "app/lib/learning/swingConflictRules.ts"
      - "app/lib/learningOwner.ts"
      - "app/lib/learningOwnerAccess.ts"
      - "app/admin/learning-hub/**"
      - "app/admin/support-rebound/**"
      - "app/lib/supportReboundResearch.ts"
      - "app/lib/research/supportReboundUniverse.ts"
      - "tests/supportReboundResearch.test.mjs"
      - "tests/supportReboundExpansion.test.mjs"
      - "app/components/BottomNav.tsx"
      - "app/api/private-learning-access/**"
      - "app/menu/page.tsx"
      - "app/api/swing-conflict-audit/**"
      - "app/lib/swingDecision.ts"
      - "app/api/swing-exit-audit/**"
      - "app/api/cron/swing-exit-audit/**"
      - "app/simulation/**"
      - "supabase/migrations/20261008_create_swing_exit_audits.sql"
      - "tests/swingExitAudit.test.mjs"
      - "tests/swingConflictAudit.test.mjs"
      - "tests/learningOwnerHub.test.mjs"
      - "app/lib/research/shadowCandlestickNine.ts"
      - "app/admin/shadow-candlestick-nine/**"
      - "tests/shadowCandlestickNine.test.mjs"
      - "app/lib/research/shadowCandlestickBatch.ts"
      - "tests/shadowCandlestickBatch.test.mjs"
      - "app/lib/research/shadowCandleYahoo.ts"
      - "app/lib/research/shadowCandleArchiveStats.ts"
      - "app/admin/shadow-candlestick-nine/archive/**"
      - "app/admin/shadow-candlestick-nine/batch/actions.ts"
      - "tests/shadowCandleStudyArchive.test.mjs"
      - "supabase/migrations/20261012_create_shadow_candle_research_runs.sql"
      - "supabase/migrations/20261012_create_shadow_candle_auto_daily_runs.sql"
      - "supabase/migrations/20261012_create_shadow_candle_auto_control.sql"
      - "app/lib/research/shadowCandleAutoSwitch.ts"
      - "app/admin/shadow-candlestick-nine/archive/actions.ts"
      - "app/lib/research/shadowCandleAutoPolicy.ts"
      - "app/lib/research/shadowCandleAutoRunner.ts"
      - "app/api/cron/shadow-candle-research/**"
      - "tests/shadowCandleAutoDaily.test.mjs"
      - "vercel.json"
      - ".github/workflows/swing-exit-audit-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/swingExitAudit.test.mjs tests/swingConflictAudit.test.mjs tests/learningOwnerHub.test.mjs tests/shadowCandlestickNine.test.mjs tests/shadowCandlestickBatch.test.mjs tests/shadowCandleStudyArchive.test.mjs tests/shadowCandleAutoDaily.test.mjs tests/supportReboundResearch.test.mjs tests/supportReboundExpansion.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
