name: WATCH holdout research tests

on:
  pull_request:
    paths:
      - 'app/lib/learning/watchPowerHoldout.ts'
      - 'app/lib/learning/watchPowerHoldoutAdapter.ts'
      - 'app/lib/learning/watchPowerHoldoutReadiness.ts'
      - 'app/admin/watch-power-holdout/page.tsx'
      - 'scripts/test-watch-power-holdout.cjs'
      - '.github/workflows/watch-power-holdout-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-watch-power-holdout.cjs
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Typecheck research integration
        run: npx tsc --noEmit --incremental false
