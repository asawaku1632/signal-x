name: Research Stage726-755 Shadow Replication
on:
  pull_request:
    paths:
      - 'app/lib/learning/shadowReplicationAudit.ts'
      - 'tests/stage726-755-shadow-replication.test.cjs'
      - '.github/workflows/research-stage726-755-shadow-replication.yml'
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stage726-755-shadow-replication.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
