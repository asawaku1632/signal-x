name: Bollinger Breakout 100 Research
on:
  pull_request:
    paths:
      - "app/lib/research/bollingerExpansionUniverse.ts"
      - "app/lib/research/bollingerExpansionRunner.ts"
      - "app/admin/bollinger-breakout-shadow/**"
      - "app/api/admin/bollinger-breakout-shadow/expand/**"
      - "supabase/migrations/20261015_bb_breakout_expansion_80.sql"
      - "tests/bollingerExpansion100.test.mjs"
      - ".github/workflows/bollinger-expansion-100.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/bollingerBreakoutShadow.test.mjs tests/bollingerBreakoutQuality.test.mjs tests/bollingerBreakoutBatchArchive.test.mjs tests/bollingerVolumeFactors.test.mjs tests/bollingerExpansion100.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
