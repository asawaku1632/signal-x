name: Owner Research All-Stars Safety
on:
  pull_request:
    paths:
      - "app/admin/research-allstars/**"
      - "app/lib/research/researchAllStars.mjs"
      - "app/lib/research/researchAllStarData.ts"
      - "app/admin/learning-hub/page.tsx"
      - "tests/researchAllStars.test.mjs"
      - ".github/workflows/research-allstars-ci.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node --test tests/researchAllStars.test.mjs tests/swingSameDayRelative.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
