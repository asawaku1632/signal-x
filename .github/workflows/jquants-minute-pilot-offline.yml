name: J-Quants minute pilot offline safety tests
on:
  push:
    branches:
      - research/ma75-breakout-retest-shadow-20261031
  workflow_dispatch:
jobs:
  offline-minute-pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical minute pilot and reconciliation without API secrets
        run: |
          node --test tests/jquantsMinutePilotHttp.test.mjs tests/morningMinuteShadow.test.mjs
