name: Alphanumeric Swing Research Characterization
on:
  push:
    branches:
      - test/alphanumeric-swing-codes-20261026
    paths:
      - "tests/swingAlphanumericCodes.test.mjs"
      - ".github/workflows/alphanumeric-swing-research-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/swingAlphanumericCodes.test.mjs
