name: SIGNALX Favorite Alerts

on:
  schedule:
    # GitHub Actions cron is UTC.
    # TSE cash session JST: 09:00-11:30 / 12:30-15:30.
    - cron: "*/5 0-1 * * 1-5"
    - cron: "0-30/5 2 * * 1-5"
    - cron: "30-55/5 3 * * 1-5"
    - cron: "*/5 4-5 * * 1-5"
    - cron: "0-30/5 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: signalx-favorite-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check buy conditions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://signal-x-ppjg.vercel.app/api/cron/favorite-ai-monitor"

      - name: Check take-profit and stop-loss
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://signal-x-ppjg.vercel.app/api/cron/favorite-ai-check"
