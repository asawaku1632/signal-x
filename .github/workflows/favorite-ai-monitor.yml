name: Favorite AI Monitor (Manual Only)

# Scheduled monitoring is handled by favorite-alerts.yml.
# Keep this workflow only for explicit manual diagnostics.
on:
  workflow_dispatch:

concurrency:
  group: favorite-ai-monitor-manual
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Activate favorite AI monitors
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://signal-x-ppjg.vercel.app/api/cron/favorite-ai-monitor"

      - name: Check active monitors for TP/SL
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://signal-x-ppjg.vercel.app/api/cron/favorite-ai-check"
