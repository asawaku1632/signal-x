name: Entry Time Shadow Offline Tests
on:
  pull_request:
    paths:
      - "app/lib/research/entryTimeShadow.mjs"
      - "app/lib/research/recheckEntryStrategy.mjs"
      - "app/lib/research/entryTimeShadowRunner.ts"
      - "app/admin/entry-time-shadow/**"
      - "app/api/cron/entry-time-shadow/**"
      - "tests/entryTimeShadow.test.mjs"
      - "tests/recheckEntryStrategy.test.mjs"
      - "supabase/migrations/20261014_create_entry_time_shadow_runs.sql"
      - ".github/workflows/entry-time-shadow-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "app/lib/research/entryTimeShadow.mjs"
      - "app/lib/research/recheckEntryStrategy.mjs"
      - "app/lib/research/entryTimeShadowRunner.ts"
      - "tests/entryTimeShadow.test.mjs"
      - "tests/recheckEntryStrategy.test.mjs"
jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/entryTimeShadow.test.mjs tests/recheckEntryStrategy.test.mjs
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
