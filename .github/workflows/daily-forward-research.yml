name: Daily Forward Research Offline Tests
on:
  push:
    branches:
      - research/morning-quote-metadata-diagnostics-20261026
    paths:
      - 'app/lib/research/dailyForwardEvaluation.mjs'
      - 'tests/dailyForwardEvaluation.test.mjs'
      - 'app/lib/research/dailyForwardInputAdapter.mjs'
      - 'tests/dailyForwardInputAdapter.test.mjs'
      - 'app/api/admin/research/daily-forward-source/route.ts'
      - 'tests/dailyForwardSourceRoute.test.mjs'
      - 'app/lib/research/dailyForwardResearchPipeline.mjs'
      - 'tests/dailyForwardResearchPipeline.test.mjs'
      - 'app/lib/research/dailyOfficialCloseBaseline.mjs'
      - 'tests/dailyOfficialCloseBaseline.test.mjs'
      - 'app/lib/research/jquantsDailyBarAdapter.mjs'
      - 'tests/jquantsDailyBarAdapter.test.mjs'
      - 'app/lib/research/jquantsDailyBatchGate.mjs'
      - 'tests/jquantsDailyBatchGate.test.mjs'
      - 'app/lib/research/gatedJquantsForwardResearch.mjs'
      - 'tests/gatedJquantsForwardResearch.test.mjs'
      - 'app/lib/research/dailyForwardScoreBands.mjs'
      - 'tests/dailyForwardScoreBands.test.mjs'
      - 'app/lib/research/dailyForwardStability.mjs'
      - 'tests/dailyForwardStability.test.mjs'
      - 'app/lib/research/dailyForwardChronologicalHoldout.mjs'
      - 'tests/dailyForwardChronologicalHoldout.test.mjs'
      - 'app/lib/research/dailyForwardEvidenceDecision.mjs'
      - 'tests/dailyForwardEvidenceDecision.test.mjs'
      - 'app/lib/research/dailyForwardImprovementProposals.mjs'
      - 'tests/dailyForwardImprovementProposals.test.mjs'
      - 'app/lib/research/dailyForwardEvidenceManifest.mjs'
      - 'tests/dailyForwardEvidenceManifest.test.mjs'
      - 'app/lib/research/dailyForwardDatasetIntegrity.mjs'
      - 'tests/dailyForwardDatasetIntegrity.test.mjs'
      - 'app/lib/research/dailyForwardProposalEvidenceGate.mjs'
      - 'tests/dailyForwardProposalEvidenceGate.test.mjs'
      - 'app/lib/research/dailyForwardReviewHistory.mjs'
      - 'tests/dailyForwardReviewHistory.test.mjs'
      - 'app/lib/research/dailyForwardReviewChain.mjs'
      - 'tests/dailyForwardReviewChain.test.mjs'
      - 'app/lib/research/dailyForwardAuditReport.mjs'
      - 'tests/dailyForwardAuditReport.test.mjs'
      - '.github/workflows/daily-forward-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-forward-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure offline forward-evaluation tests
        run: node --test tests/dailyForwardEvaluation.test.mjs tests/dailyForwardInputAdapter.test.mjs tests/dailyForwardSourceRoute.test.mjs tests/dailyForwardResearchPipeline.test.mjs tests/dailyOfficialCloseBaseline.test.mjs tests/jquantsDailyBarAdapter.test.mjs tests/jquantsDailyBatchGate.test.mjs tests/gatedJquantsForwardResearch.test.mjs tests/dailyForwardScoreBands.test.mjs tests/dailyForwardStability.test.mjs tests/dailyForwardChronologicalHoldout.test.mjs tests/dailyForwardEvidenceDecision.test.mjs tests/dailyForwardImprovementProposals.test.mjs tests/dailyForwardEvidenceManifest.test.mjs tests/dailyForwardDatasetIntegrity.test.mjs tests/dailyForwardProposalEvidenceGate.test.mjs tests/dailyForwardReviewHistory.test.mjs tests/dailyForwardReviewChain.test.mjs tests/dailyForwardAuditReport.test.mjs
