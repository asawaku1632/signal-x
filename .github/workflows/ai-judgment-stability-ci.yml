name: AI Judgment Stability Offline Tests
on:
  pull_request:
    paths:
      - "app/lib/research/aiJudgmentStability.mjs"
      - "app/lib/research/fixedCohortJudgment.mjs"
      - "app/lib/research/broadCohortShadow.mjs"
      - "app/lib/research/broadCohortAudit.mjs"
      - "app/lib/research/broadCohortShadowStore.ts"
      - "app/lib/research/fixedCohortJudgmentStore.ts"
      - "app/api/cron/golden-zone/route.ts"
      - "supabase/migrations/20261014_create_ai_stability_fixed_cohort.sql"
      - "supabase/migrations/20261014_create_broad_ai_research_top30.sql"
      - "app/admin/ai-judgment-stability/**"
      - "app/admin/learning-hub/page.tsx"
      - "tests/aiJudgmentStability.test.mjs"
      - "tests/fixedCohortJudgment.test.mjs"
      - "tests/broadCohortShadow.test.mjs"
      - "tests/broadCohortAudit.test.mjs"
      - ".github/workflows/ai-judgment-stability-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "app/lib/research/aiJudgmentStability.mjs"
      - "app/lib/research/fixedCohortJudgment.mjs"
      - "app/lib/research/broadCohortShadow.mjs"
      - "app/lib/research/broadCohortAudit.mjs"
      - "app/lib/research/broadCohortShadowStore.ts"
      - "app/lib/research/fixedCohortJudgmentStore.ts"
      - "app/api/cron/golden-zone/route.ts"
      - "supabase/migrations/20261014_create_ai_stability_fixed_cohort.sql"
      - "supabase/migrations/20261014_create_broad_ai_research_top30.sql"
      - "tests/aiJudgmentStability.test.mjs"
      - "tests/fixedCohortJudgment.test.mjs"
      - "tests/broadCohortShadow.test.mjs"
      - "tests/broadCohortAudit.test.mjs"
jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/aiJudgmentStability.test.mjs tests/fixedCohortJudgment.test.mjs tests/broadCohortShadow.test.mjs tests/broadCohortAudit.test.mjs
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
