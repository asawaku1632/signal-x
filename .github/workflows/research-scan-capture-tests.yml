name: Scan Research Capture Tests

on:
  push:
    branches:
      - research/scan-capture-validation-20261027
  pull_request:
    paths:
      - 'app/lib/learning/**'
      - 'tests/research/**'
      - 'scripts/research/import-generated-scan-dev.mjs'
      - 'scripts/research/import-completed-scan-execution-dev.mjs'
      - '.github/workflows/research-scan-capture-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signalx_ci
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: signalx_research_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalx_ci -d signalx_research_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run isolated research and PostgreSQL integration tests
        env:
          NODE_ENV: test
          SIGNALX_RESEARCH_ISOLATED_PG: 'true'
          SIGNALX_RESEARCH_CI_PASSWORD: ci_local_only
        run: node --test tests/research/scan-feature-capture-validation.test.mjs tests/research/prepare-scan-feature-captures.test.mjs tests/research/save-research-scan-capture-dev.test.mjs tests/research/compare-forward-results.test.mjs tests/research/assess-capture-for-review.test.mjs tests/research/build-scan-evidence-review.test.mjs tests/research/isolated-pg-scan-save.test.mjs tests/research/build-generated-scan-research-envelope.test.mjs tests/research/jpx-equity-calendar.test.mjs tests/research/summarize-verified-forward-research.test.mjs tests/research/preview-generated-scan-research-capture.test.mjs tests/research/audit-generated-scan-before-forward-research.test.mjs tests/research/plan-scan-research-intake.test.mjs tests/research/assess-scan-research-pipeline-readiness.test.mjs tests/research/ingest-generated-scan-into-research-dev.test.mjs tests/research/import-generated-scan-dev.test.mjs tests/research/audit-scan-payload-for-research-capture.test.mjs tests/research/create-generated-scan-research-artifact.test.mjs tests/research/ingest-completed-scan-execution-dev.test.mjs tests/research/import-completed-scan-execution-dev.test.mjs tests/research/import-completed-scan-replay-protection.test.mjs tests/research/export-generated-scan-research-artifact-dev.test.mjs tests/research/capture-research-dev-scan-execution.test.mjs tests/research/capture-and-ingest-research-dev-scan.test.mjs tests/research/immutable-pattern-forward-sql-contract.test.mjs tests/research/isolated-pg-forward-immutable-save.test.mjs tests/research/pattern-forward-input-immutability-audit.test.mjs tests/research/assess-ai-power-improvement-evidence.test.mjs tests/research/assess-historical-research-dataset.test.mjs tests/research/classify-research-evidence.test.mjs tests/research/describe-verified-ai-power-bands.test.mjs tests/research/classify-research-data-use.test.mjs
