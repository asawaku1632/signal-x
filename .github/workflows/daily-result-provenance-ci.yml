name: Daily Result Provenance Audit
on:
  pull_request:
    paths:
      - "app/lib/learning/checkDailyRunner.ts"
      - "app/api/admin/ai-win-rate-audit/**"
      - "app/admin/ai-win-rate-audit/**"
      - "app/admin/learning-status/page.tsx"
      - "supabase/migrations/20261009_create_daily_result_price_provenance.sql"
      - "tests/dailyResultProvenanceAudit.test.mjs"
      - ".github/workflows/daily-result-provenance-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/dailyResultProvenanceAudit.test.mjs tests/dailyCheckRecoveryCron.test.mjs tests/phase1DailySnapshotIsolation.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
