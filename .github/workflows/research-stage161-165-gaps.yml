name: Research Stage161-165 Evidence Gaps
on:
  pull_request:
    paths:
      - 'app/lib/learning/researchEvidenceGaps.ts'
      - 'app/lib/learning/swingResearchReviewSnapshot.ts'
      - 'app/admin/research-review/page.tsx'
      - 'tests/stage161-165-evidence-gaps.test.cjs'
      - '.github/workflows/research-stage161-165-gaps.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stage161-165-evidence-gaps.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
