name: Research Stage606-635 Calendar Classification
on:
  pull_request:
    paths:
      - 'app/lib/learning/storedEvidenceClassification.ts'
      - 'tests/stage456-485-evidence-db.test.cjs'
      - 'tests/stage606-635-calendar-classification-realdb.test.cjs'
      - '.github/workflows/research-stage606-635-calendar-classification.yml'
permissions:
  contents: read
jobs:
  classification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_only
          POSTGRES_PASSWORD: ephemeral_test_password
          POSTGRES_DB: signalx_alpha217_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_only -d signalx_alpha217_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: New real DB classification checks
        env:
          SIGNALX_E2E_DATABASE_URL: postgres://test_only:ephemeral_test_password@127.0.0.1:5432/signalx_alpha217_ci
        run: node --test tests/stage606-635-calendar-classification-realdb.test.cjs
      - name: Previous regression in separate disposable database
        env:
          SIGNALX_E2E_DATABASE_URL: postgres://test_only:ephemeral_test_password@127.0.0.1:5432/signalx_alpha217_ci
        run: |
          psql "postgres://test_only:ephemeral_test_password@127.0.0.1:5432/signalx_alpha217_ci" -c "DROP TABLE IF EXISTS public.swing_universe_observations"
          node --test tests/stage456-485-evidence-db.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
