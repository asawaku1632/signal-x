name: Morning Quote Metadata Research Tests
on:
  push:
    branches:
      - research/morning-quote-metadata-diagnostics-20261026
    paths:
      - 'app/lib/research/morningQuoteMetadata.ts'
      - 'app/lib/research/morningQuoteDiagnosticAdapter.ts'
      - 'app/lib/research/morningFinalCheckRunner.ts'
      - 'app/learning/patterns/**/page.tsx'
      - 'tests/morningQuoteMetadata.test.mjs'
      - 'tests/morningQuoteIntegration.test.mjs'
      - 'tests/morningQuoteSqlSecurity.test.mjs'
      - 'tests/morningQuoteSafeRecord.test.mjs'
      - 'app/lib/research/morningQuoteSafeRecord.ts'
      - 'app/lib/research/morningQuoteDiagnosisSummary.mjs'
      - 'tests/morningQuoteDiagnosisSummary.test.mjs'
      - 'research/sql/morning_0905_dev_diagnostic_draft.sql'
      - '.github/workflows/morning-quote-metadata-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-metadata-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck research branch
        run: npx tsc --noEmit --incremental false
      - name: Run offline metadata unit tests
        run: node --test tests/morningQuoteMetadata.test.mjs tests/morningQuoteIntegration.test.mjs tests/morningQuoteSqlSecurity.test.mjs tests/morningQuoteSafeRecord.test.mjs tests/morningQuoteDiagnosisSummary.test.mjs
