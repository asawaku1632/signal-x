name: Price Reference Trend Checks
on:
  pull_request:
    paths:
      - "app/lib/learning/priceReferenceTrend.ts"
      - "app/lib/learning/priceReferenceTrendAnalysis.ts"
      - "app/api/admin/price-reference-trend/**"
      - "app/admin/price-reference-trend/**"
      - "app/admin/daily-price-reference/page.tsx"
      - "tests/priceReferenceTrend.test.mjs"
      - ".github/workflows/price-reference-trend-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/priceReferenceTrend.test.mjs tests/learningPriceReferenceShadow.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
