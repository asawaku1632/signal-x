name: Verify Golden Zone TypeScript
on:
  push:
    branches: [main]
    paths:
      - 'app/admin/golden-zone/**'
      - 'app/admin/explosive-watch/**'
      - 'app/api/cron/golden-zone/**'
      - 'app/admin/learning-status/**'
      - '.github/workflows/golden-zone-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
