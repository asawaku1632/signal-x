name: Research Stage226-235 Final Readiness
on:
  pull_request:
    paths:
      - 'app/lib/learning/finalResearchReadiness.ts'
      - 'app/lib/learning/integratedResearchReview.ts'
      - 'app/admin/research-review/page.tsx'
      - 'tests/stage226-235-final-readiness.test.cjs'
      - '.github/workflows/research-stage226-235-final-readiness.yml'
permissions:
  contents: read
jobs:
  final-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stage226-235-final-readiness.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
