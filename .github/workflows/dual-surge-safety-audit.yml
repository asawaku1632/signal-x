name: Dual Surge Research Safety Audit
on:
  push:
    branches:
      - fix/dual-surge-dev-db-isolation-20261023
    paths:
      - 'tests/research/dualSurge*'
      - 'app/admin/dual-surge-shadow/**'
      - 'app/lib/learningOwner*'
      - 'app/lib/research/dualSurge*'
      - 'docs/research/dual-surge-user-diagnostic-events-20261025.json'
      - '.github/workflows/dual-surge-safety-audit.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/research/dualSurge*'
      - 'app/admin/dual-surge-shadow/**'
      - 'app/lib/learningOwner*'
      - 'app/lib/research/dualSurge*'
      - 'docs/research/dual-surge-user-diagnostic-events-20261025.json'
      - '.github/workflows/dual-surge-safety-audit.yml'
permissions:
  contents: read
jobs:
  offline-audit:
    if: github.ref == 'refs/heads/fix/dual-surge-dev-db-isolation-20261023' || github.event.pull_request.head.ref == 'fix/dual-surge-dev-db-isolation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline research safety tests
        run: node --test tests/research/dualSurgeStep140SafetyAudit.test.mjs tests/research/dualSurgeOwnerBoundaryAudit.test.mjs
