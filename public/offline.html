<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>オフライン | SIGNALX</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #0f172a;
        background: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section { max-width: 448px; text-align: center; }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 16px 0 0; color: #475569; line-height: 1.75; }
      a {
        display: inline-flex;
        margin-top: 32px;
        padding: 12px 20px;
        border-radius: 8px;
        color: #ffffff;
        background: #2563eb;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>オフラインです</h1>
        <p>通信できません。インターネット接続を確認してください</p>
        <a href="/">再読み込み</a>
      </section>
    </main>
  </body>
</html>
