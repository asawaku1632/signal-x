name: Daily Check Strict Coverage
on:
  pull_request:
    paths:
      - "app/lib/learning/checkDailyRunner.ts"
      - "app/lib/learning/dailyCheckMarketGuard.ts"
      - "tests/dailyCheckMarketGuard.test.mjs"
      - ".github/workflows/daily-check-strict-coverage-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/dailyCheckMarketGuard.test.mjs tests/phase1DailySnapshotIsolation.test.mjs tests/dailyCheckRecoveryCron.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
