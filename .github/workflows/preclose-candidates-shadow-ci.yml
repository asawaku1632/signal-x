name: Preclose Candidate Shadow Checks
on:
  pull_request:
    paths:
      - "app/admin/preclose-candidates/**"
      - "app/lib/research/precloseCandidateStudy.ts"
      - "app/lib/research/precloseBudgetComparison.ts"
      - "app/lib/research/precloseDisjointTimeStudy.ts"
      - "app/admin/learning-hub/page.tsx"
      - "tests/precloseCandidateStudy.test.mjs"
      - "tests/precloseBudgetComparison.test.mjs"
      - "tests/precloseDisjointTimeStudy.test.mjs"
      - ".github/workflows/preclose-candidates-shadow-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/precloseCandidateStudy.test.mjs tests/precloseBudgetComparison.test.mjs tests/precloseDisjointTimeStudy.test.mjs tests/learningOwnerHub.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
