name: Afternoon Rebound Research Tests
on:
  pull_request:
    paths:
      - 'app/lib/research/afternoonReboundStudy.mjs'
      - 'app/lib/research/approvedAfternoonPair.mjs'
      - 'app/lib/research/afternoonLimitStudy.mjs'
      - 'app/lib/research/intradayObservationContract.mjs'
      - 'tests/afternoonReboundStudy.test.mjs'
      - 'tests/approvedAfternoonPair.test.mjs'
      - 'tests/afternoonLimitStudy.test.mjs'
      - 'tests/intradayObservationContract.test.mjs'
      - '.github/workflows/afternoon-rebound-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run isolated research tests
        run: node --test tests/afternoonReboundStudy.test.mjs tests/afternoonLimitStudy.test.mjs tests/intradayObservationContract.test.mjs tests/approvedAfternoonPair.test.mjs
