name: Research Stage136-140 Combined Isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'tests/stage136-140-realdb.test.cjs'
      - 'app/lib/learning/swingUniverseAudit.ts'
      - '.github/workflows/research-stage136-140-isolated.yml'
permissions:
  contents: read
jobs:
  outcome-recovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_only
          POSTGRES_PASSWORD: ephemeral_test_password
          POSTGRES_DB: signalx_alpha217_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_only -d signalx_alpha217_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Stage 136-140 actual calendar and PostgreSQL outcome recovery
        env:
          SIGNALX_E2E_DATABASE_URL: postgres://test_only:ephemeral_test_password@127.0.0.1:5432/signalx_alpha217_ci
        run: node tests/stage136-140-realdb.test.cjs
