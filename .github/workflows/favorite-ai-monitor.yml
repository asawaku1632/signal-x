name: Favorite AI Monitor

on:
  schedule:
    # GitHub Actions cron is UTC. Run every 10 minutes through the full
    # Tokyo Stock Exchange cash session (09:00-15:30 JST) on weekdays.
    - cron: "*/10 0-1 * * 1-5"
    - cron: "0-30/10 2 * * 1-5"
    - cron: "30-50/10 3 * * 1-5"
    - cron: "*/10 4-5 * * 1-5"
    - cron: "0-30/10 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: favorite-ai-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Activate favorite AI monitors
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://signal-x-ppjg.vercel.app/api/cron/favorite-ai-monitor"

      - name: Check active monitors for TP/SL
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://signal-x-ppjg.vercel.app/api/cron/favorite-ai-check"
