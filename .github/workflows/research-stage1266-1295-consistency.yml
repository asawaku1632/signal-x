name: Research Stage1266-1295 Snapshot Consistency
on:
  pull_request:
    paths:
      - 'app/lib/learning/researchSnapshotConsistency.mjs'
      - 'tests/stage1266-1295-snapshot-consistency.test.mjs'
      - '.github/workflows/research-stage1266-1295-consistency.yml'
permissions:
  contents: read
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/stage1266-1295-snapshot-consistency.test.mjs
