name: Research Stage236-245 Observation Integrity
on:
  pull_request:
    paths:
      - 'app/lib/learning/swingObservationIntegrity.ts'
      - 'app/lib/learning/integratedResearchReview.ts'
      - 'app/admin/research-review/page.tsx'
      - 'tests/stage236-245-observation-integrity.test.cjs'
      - '.github/workflows/research-stage236-245-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/stage236-245-observation-integrity.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
