name: Price Reference Shadow Checks
on:
  pull_request:
    paths:
      - "app/lib/learning/dailyPriceAudit.ts"
      - "app/lib/learning/priceReferenceObservations.ts"
      - "app/api/admin/daily-price-reference/**"
      - "app/admin/daily-price-reference/**"
      - "app/admin/daily-price-audit/page.tsx"
      - "supabase/migrations/20261010_create_daily_learning_price_reference_audits.sql"
      - "tests/learningPriceReferenceShadow.test.mjs"
      - ".github/workflows/price-reference-shadow-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/learningPriceReferenceShadow.test.mjs tests/dailyPriceAudit.test.mjs
      - run: npx next typegen
      - run: npx tsc --noEmit
