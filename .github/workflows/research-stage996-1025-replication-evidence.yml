name: Research Stage996-1025 Replication Evidence
on:
  pull_request:
    paths:
      - 'app/lib/learning/researchReplicationEvidence.mjs'
      - 'tests/stage996-1025-replication-evidence.test.mjs'
      - '.github/workflows/research-stage996-1025-replication-evidence.yml'
permissions:
  contents: read
jobs:
  descriptive-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/stage996-1025-replication-evidence.test.mjs
