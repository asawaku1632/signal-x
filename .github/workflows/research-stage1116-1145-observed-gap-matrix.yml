name: Research Stage1116-1145 Observed Gap Matrix
on:
  pull_request:
    paths:
      - 'app/lib/learning/researchObservedGapMatrix.mjs'
      - 'tests/stage1116-1145-observed-gap-matrix.test.mjs'
      - '.github/workflows/research-stage1116-1145-observed-gap-matrix.yml'
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/stage1116-1145-observed-gap-matrix.test.mjs
